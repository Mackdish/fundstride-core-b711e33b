name: Verify BuildTrack360

on:
  push:
    branches:
      - main
      - feat/customer-progress-portal
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build
        run: bun run build

      # The existing repository baseline currently has thousands of repository-wide
      # Prettier/ESLint violations. Keep lint visible while the baseline is cleaned up.
      - name: Lint (baseline currently has existing failures)
        run: bun run lint
        continue-on-error: true
